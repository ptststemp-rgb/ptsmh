name: PTS Pipeline
on:
  workflow_dispatch:
    inputs:
      job_id: {description: 'Job ID', required: true}
      download_url: {description: 'URL', required: true}
      imdb_id: {description: 'IMDb', required: true}
      title: {description: 'Title', required: true}
      content_type: {description: 'Type', required: true}
      label: {description: 'Label', required: true}
      vps_webhook_url: {description: 'Webhook', required: true}
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        run: |
          pip install yt-dlp huggingface_hub requests
          sudo apt-get update && sudo apt-get install -y ffmpeg aria2
      - name: Run
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          DOWNLOAD_URL: ${{ github.event.inputs.download_url }}
          IMDB_ID: ${{ github.event.inputs.imdb_id }}
          TITLE: ${{ github.event.inputs.title }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
          LABEL: ${{ github.event.inputs.label }}
          VPS_WEBHOOK_URL: ${{ github.event.inputs.vps_webhook_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: python scripts/process.py
      - name: Report failure
        if: ${{ failure() }}
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          VPS_WEBHOOK_URL: ${{ github.event.inputs.vps_webhook_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -s -X POST "$VPS_WEBHOOK_URL" -H 'Content-Type: application/json' -d "{\"job_id\": \"$JOB_ID\", \"stage\": \"failed\", \"progress\": 0, \"error\": \"GitHub job failed\", \"secret\": \"$WEBHOOK_SECRET\"}" || true
      - name: Report timeout or cancel
        if: ${{ cancelled() }}
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          VPS_WEBHOOK_URL: ${{ github.event.inputs.vps_webhook_url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -s -X POST "$VPS_WEBHOOK_URL" -H 'Content-Type: application/json' -d "{\"job_id\": \"$JOB_ID\", \"stage\": \"failed\", \"progress\": 0, \"error\": \"GitHub job timed out (6h limit) or was cancelled\", \"secret\": \"$WEBHOOK_SECRET\"}" || true
